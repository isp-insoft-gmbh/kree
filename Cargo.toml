[package]
name = "kree"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Cron-scheduled reminders in your Windows tray."
authors = ["Oliver Krylow <o.krylow@isp-insoft.de>"]
publish = false

# Size-first release profile. kree is GUI / I/O bound, not hot-loop
# CPU, so trading a bit of throughput for smaller binaries is the
# right call. See docs/specs/T1-optimized-release-profile.md.
[profile.release]
opt-level = "s"     # size-first; sometimes beats "z" by re-enabling vectorization
lto = "fat"         # whole-program inlining; biggest single size win
codegen-units = 1   # one unit = better cross-module optimization
strip = "symbols"   # drop debug + symbol tables from the final binary
panic = "abort"     # no unwinding tables; we exit cleanly via process::exit

[dependencies]
# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Async runtime — used only for scheduler timers + mpsc to UI
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }

# Cron parsing / file watching / paths / editor
chrono = { version = "0.4", default-features = false, features = ["clock"] }
croner = "3"
notify-debouncer-mini = "0.7"
directories = "6"
edit = { version = "0.1", features = ["better-path", "quoted-env"] }

# GUI / tray / audio / TTS — egui re-exported via eframe::egui
eframe = "0.34"
tray-icon = "0.22"
rodio = "0.22"
tts = "0.26"
# PNG decode for the embedded tray icon. `image` is already a transitive
# of egui; declaring it directly with png-only keeps the surface tight.
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows integration
single-instance = "0.3"
auto-launch = "0.6"
# Win32 work-area lookup for popup-anchor fallback when the tray rect is
# unavailable. Step 6 originally used this for a manual GetMessage loop;
# step 9 hands the loop to eframe/winit but keeps the system-parameters
# call for popup positioning.
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# Emoji extraction
unicode-segmentation = "1"
unicode-properties = { version = "0.1", features = ["emoji"] }
