name: Outdated dependencies

on:
  schedule:
    # Mondays 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Nothing here builds kree — cargo-outdated resolves Cargo.toml against
# crates.io — so this does not need a Windows runner, and GitHub-hosted Linux
# is free for public repositories. It used to compile cargo-outdated from
# source on a paid Windows runner every Monday.
jobs:
  outdated:
    name: Check for outdated crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Caches ~/.cargo/bin, so cargo-outdated is fetched once rather than
      # reinstalled on every weekly run.
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-outdated
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated
      - name: Run cargo-outdated
        id: outdated
        shell: bash
        run: |
          set +e
          OUTPUT=$(cargo outdated -R --exit-code 1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo "report<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # Always succeed; outdated crates aren't a build failure
          exit 0
      - name: Open or update issue
        if: steps.outdated.outputs.status != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const report = `${{ steps.outdated.outputs.report }}`;
            const title = "Outdated dependencies detected";
            const body = `Weekly \`cargo outdated -R\` report:\n\n\`\`\`\n${report}\n\`\`\`\n`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies",
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependencies"],
              });
            }
