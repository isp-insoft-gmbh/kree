name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

# A dependabot force-push or a quick follow-up commit otherwise leaves the
# superseded run compiling to no purpose. Cancel those. Never cancel a trunk
# run: its result is what branch protection reads, and it is the only run
# allowed to populate the cache (see save-if below).
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS: "-D warnings" here. Cargo.toml's [lints] table already
  # denies warnings for this crate, and does it *only* for this crate —
  # RUSTFLAGS applies to every dependency too, so one upstream warning would
  # fail our build for something we cannot fix. It also feeds the cache key.

jobs:
  build-and-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A cache written on a PR branch can only ever be read back by that
          # same branch. Every dependabot branch was therefore writing a
          # ~230 MB cache that nothing would restore, while evicting trunk's
          # cache — the one PRs *can* read — from the repo's 10 GB budget.
          # Result: a 1-second "restore" and a full cold rebuild every run.
          # Save from trunk only; PRs restore from it.
          save-if: ${{ github.ref == 'refs/heads/trunk' }}

      # Deliberately not --all-targets. That pulled criterion, plotters and
      # clap through fat LTO with codegen-units = 1 to produce benchmark
      # binaries nobody runs here. docs/specs/spec.md § 7 asks for
      # `cargo build --release`; the bench targets are compile-checked by
      # clippy --all-targets in the lint job.
      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all-features

  lint:
    name: Lint (fmt + clippy)
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  supply-chain:
    name: Supply chain (cargo-deny)
    # Was two Windows jobs, `cargo audit` and `cargo deny check`. cargo-deny is
    # a strict superset: its [advisories] section reads the same RustSec DB
    # cargo-audit does, and it additionally enforces the license allowlist,
    # the duplicate-version and wildcard bans, and the registry pinning — all
    # already configured in deny.toml. cargo-audit checked advisories and
    # nothing else, so it was a whole job of duplicated coverage.
    #
    # Neither tool compiles the crate — they read Cargo.lock — and deny.toml
    # pins the graph to x86_64-pc-windows-msvc, so the Windows dependency tree
    # is what gets evaluated whatever the host. GitHub-hosted Linux is free for
    # public repositories, so this costs no Blacksmith minutes at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache: nothing here compiles, and a third cache entry would
      # only crowd out the two that matter.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run deny
        run: cargo deny check
