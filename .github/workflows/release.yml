name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Two tags pushed in quick succession would otherwise produce two parallel
# runs that race on the same GitHub release. Don't cancel in progress —
# a half-uploaded asset is worse than waiting.
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & publish
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release

      - name: Verify artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/kree.exe)) {
            throw "kree.exe missing — release build did not produce the artifact."
          }
          Get-Item target/release/kree.exe | Format-List Name, Length, LastWriteTime

      - name: Verify release notes exist
        shell: pwsh
        run: |
          if (-not (Test-Path RELEASE_NOTES.md)) {
            throw "RELEASE_NOTES.md missing — create it for every release."
          }
          if ([string]::IsNullOrWhiteSpace((Get-Content RELEASE_NOTES.md -Raw))) {
            throw "RELEASE_NOTES.md is empty."
          }

      - name: Determine prerelease flag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: prerelease
        shell: pwsh
        run: |
          # Mark the GitHub release as prerelease when the tag carries a
          # SemVer pre-release segment (e.g. v0.1.0-alpha.1).
          if ('${{ github.ref_name }}' -match '-') {
            "is_prerelease=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "is_prerelease=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            target/release/kree.exe
            assets/fonts/LICENSE-JetBrainsMono-OFL.txt
            assets/fonts/LICENSE-NerdFonts-MIT.txt
            assets/fonts/LICENSE-NotoEmoji-OFL.txt

      - name: Summarize manual verification
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @'
          ## Release verification

          Release binary and notes verified. Manual runs do not publish a GitHub Release.
          '@
